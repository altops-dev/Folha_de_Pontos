<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folha de Pontos - {{ user }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Olá, {{ user }}!</h1>
        <p>Registre seu ponto abaixo:</p>
        
        <div class="buttons">
            <form action="{{ url_for('registrar', tipo='Entrada') }}" method="POST">
                <button type="submit" class="btn-entrada">Registrar Entrada</button>
            </form>
            <form action="{{ url_for('registrar', tipo='Saída') }}" method="POST">
                <button type="submit" class="btn-saida">Registrar Saída</button>
            </form>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <div class="footer">
            <a href="{{ url_for('logout') }}">Sair / Trocar Usuário</a>
        </div>
    </div>
</body>
</html>
