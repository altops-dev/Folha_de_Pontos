name: Validation and Security CI

on:
  push:
    branches:
      - '**'

  pull_request:

  workflow_dispatch:

jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Bloquear credenciais commitadas
        run: |
          failed=0
          if [ -f service_account.json ]; then
            echo "service_account.json não deve estar no repositório."
            failed=1
          fi
          if [ -f .env ]; then
            echo ".env não deve estar no repositório."
            failed=1
          fi
          if git grep -n -- 'folha-de-pontos-504115' -- ':!README.md' ':!.github/**' >/dev/null 2>&1; then
            echo "Identificador de projeto GCP real encontrado no código."
            failed=1
          fi
          exit "$failed"

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ferramentas de validação
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pip-audit

      - name: Validação de sintaxe e qualidade (Ruff)
        run: ruff check --exit-zero .

      - name: Análise estática de segurança (Bandit)
        run: bandit -r . -x ./venv,./.venv,./tests -ll --exit-zero

      - name: Vulnerabilidades em pacotes (pip-audit)
        run: pip-audit -r requirements.txt
